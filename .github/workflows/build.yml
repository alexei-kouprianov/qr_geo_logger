name: Build APK

# Trigger on push to main branch or manual workflow_dispatch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      # Optional: force actions to Node 24 to avoid future warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Create a temporary Flutter project on the runner
      - name: Create Flutter project
        run: |
          flutter create build_app
          # Remove the default main.dart
          rm build_app/lib/main.dart
          # Copy your main.dart from repo root
          cp lib/main.dart build_app/lib/main.dart
          # Copy your pubspec.yaml from repo root
          cp pubspec.yaml build_app/pubspec.yaml

      # 4. Set app name
      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="QGGeoLogger"/' build_app/android/app/src/main/AndroidManifest.xml

      # 5. Manage permissions
      - name: Add location permissions
        run: |
          sed -i '/<manifest/a\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' \
          build_app/android/app/src/main/AndroidManifest.xml

      # 6. Disable R8 shrinking (required for ML Kit OCR)
      - name: Patch Gradle for ML Kit
        run: |
          if [ -f build_app/android/app/build.gradle ]; then
          sed -i '/buildTypes {/a\        release {\n            minifyEnabled false\n            shrinkResources false\n        }' build_app/android/app/build.gradle
          fi
          if [ -f build_app/android/app/build.gradle.kts ]; then
          sed -i '/buildTypes {/a\        release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }' build_app/android/app/build.gradle.kts
          fi

      # 7. Get dependencies
      - name: Install dependencies
        run: |
          cd build_app
          flutter pub get
          flutter pub upgrade

      # 8. Build release APK
      - name: Build release APK
        run: |
          cd build_app
          flutter build apk --release

      # 9. Rename APK
      - name: Rename APK
        run: |
          mv build_app/build/app/outputs/flutter-apk/app-release.apk \
          build_app/build/app/outputs/flutter-apk/QGGeoLogger.apk

      # 10. Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QGGeoLogger_apk
          path: build_app/build/app/outputs/flutter-apk/QGGeoLogger.apk
        # with:
        #   name: qr_geo_logger_apk
        #   path: build_app/build/app/outputs/flutter-apk/app-release.apk
