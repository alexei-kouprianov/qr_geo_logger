name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create build_app
          rm build_app/lib/main.dart
          cp app/main.dart build_app/lib/main.dart
          cp app/pubspec.yaml build_app/pubspec.yaml

      - name: Install dependencies
        run: |
          cd build_app
          flutter pub get

      - name: Build APK
        run: |
          cd build_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qr_geo_logger_apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
