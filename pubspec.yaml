name: qr_geo_logger
description: Geo-tagged QR and barcode logger
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  mobile_scanner: ^7.2.0
  geolocator: ^14.0.2
  share_plus: ^12.0.1
  intl: ^0.20.2
  vibration: ^1.8.4
  path_provider: ^2.1.4
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

flutter:
  uses-material-design: true
