name: qr_geo_logger
description: Geo-tagged QR and barcode logger
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.10.5
  geolocator: ^14.0.2
  google_mlkit_text_recognition: ^0.13.1
  mobile_scanner: ^7.2.0
  path_provider: ^2.1.4
  share_plus: ^12.0.1
  intl: ^0.20.2

flutter:
  uses-material-design: true
